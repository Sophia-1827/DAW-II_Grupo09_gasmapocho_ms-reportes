spring.application.name=ms-reportes
server.port=8084
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# La configuracion completa (base de datos, RabbitMQ, rutas, etc.) vive en el repo de configuracion y la sirve
# config-server. Se le encuentra por Eureka, igual que al resto de servicios.
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server
spring.config.import=configserver:

# SOAP (Spring Web Services): los servicios quedan bajo /ws y el WSDL del reporte en /ws/reportes.wsdl (o /ws/reportes?wsdl)
spring.webservices.path=/ws
# Reescribe la direccion del servicio dentro del WSDL con el host desde el que se pidio (por ejemplo el gateway)
spring.webservices.servlet.init.transformWsdlLocations=true
server.forward-headers-strategy=framework
